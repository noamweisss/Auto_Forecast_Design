<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תחזית יומית</title>
  <style>
    @font-face {
      font-family: "IMS Story Black";
      src: url("{{ context.assets.black_font_uri }}") format("truetype");
      font-style: normal;
      font-weight: 900;
      font-display: block;
    }
    @font-face {
      font-family: "IMS Story SemiBold";
      src: url("{{ context.assets.semibold_font_uri }}") format("truetype");
      font-style: normal;
      font-weight: 600;
      font-display: block;
    }
    {% include "forecast_story.css" %}
  </style>
</head>
<body>
  <main id="story-canvas" aria-label="תחזית מזג האוויר היומית">
    <header id="story-header">
      <div id="header-line">
        <span id="header-hebrew" dir="rtl">{{ context.header_hebrew_calendar }}</span>
        <span id="header-gregorian" dir="ltr">{{ context.header_gregorian_numeric }}</span>
      </div>
      <div id="header-separator" aria-hidden="true"></div>
    </header>

    <div id="story-map" aria-hidden="true">
      <img id="israel-map" src="{{ context.assets.map_uri }}" alt="">
    </div>

    <section id="forecast-layer" aria-label="פרטי התחזית">
      <p id="country-description" dir="rtl">{{ context.country_description_hebrew }}</p>
    </section>

    <section id="city-layer" aria-label="תחזיות לפי עיר">
      {% for city in context.cities %}
      <article
        class="city-marker layout-{{ city.layout.value|lower }}"
        data-city-key="{{ city.internal_key }}"
        style="left: {{ city.x|css_number }}px; top: {{ city.y|css_number }}px"
      >
        <img class="city-icon" src="{{ city.icon_uri }}" alt="">
        <div class="city-copy" dir="rtl">
          <div class="city-name">{{ city.name_hebrew }}</div>
          <bdi class="temperature" dir="ltr">{{ city.temperature_text }}</bdi>
        </div>
      </article>
      {% endfor %}
    </section>

    <div id="logo-group" aria-label="סמלי השירות">
      <img id="mot-logo" src="{{ context.assets.mot_logo_uri }}" alt="">
      <img id="ims-logo" src="{{ context.assets.ims_logo_uri }}" alt="">
    </div>
  </main>
</body>
</html>
